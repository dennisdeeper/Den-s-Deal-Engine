<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03090b">
<title>Media Deal Engine Scanner</title>

<script src="https://unpkg.com/@zxing/browser@latest"></script>

<style>
:root{
  --bg:#03090b;
  --panel:#071317;
  --line:rgba(61,238,224,.18);
  --teal:#22e0d1;
  --text:#f4f7f7;
  --muted:#81969a;
  --green:#31d887;
  --red:#ff4040;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -15%,rgba(20,181,169,.22),transparent 35%),
    linear-gradient(180deg,#020708 0%,#061014 55%,#020709 100%);
  color:var(--text);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:12px 12px 90px;
}

.topbar{
  height:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}

.back{
  color:#dce7e8;
  text-decoration:none;
  font-size:13px;
}

.brand{
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.live{
  display:flex;
  align-items:center;
  gap:7px;
  color:#91a5a8;
  font-size:9px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px rgba(49,216,135,.6);
}

.hero{
  text-align:center;
  padding:24px 0 18px;
}

.hero h1{
  margin:0;
  font-size:25px;
  font-weight:300;
  letter-spacing:.08em;
}

.hero h1 span{
  color:var(--teal);
}

.hero p{
  margin:9px auto 0;
  color:#81969a;
  font-size:12px;
}

.scannerCard{
  padding:12px;
  border-radius:22px;
  border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(10,27,31,.94),rgba(4,13,16,.98));
}

.cameraWrap{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  background:#000;
  height:58vh;
  min-height:390px;
  max-height:620px;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.scanBox{
  position:absolute;
  left:9%;
  right:9%;
  top:36%;
  height:150px;
  border:2px solid rgba(34,224,209,.82);
  border-radius:18px;
  box-shadow:
    0 0 0 999px rgba(0,0,0,.15),
    0 0 26px rgba(34,224,209,.14);
}

.laser{
  position:absolute;
  left:11%;
  right:11%;
  top:50%;
  height:2px;
  background:linear-gradient(
    90deg,
    transparent,
    var(--red),
    transparent
  );
  box-shadow:0 0 12px rgba(255,64,64,.9);
}

.status{
  min-height:40px;
  padding:13px 5px 4px;
  text-align:center;
  color:#91a5a8;
  font-size:12px;
  line-height:1.45;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:11px;
}

button{
  min-height:52px;
  border-radius:14px;
  border:0;
  font:inherit;
  font-weight:750;
  letter-spacing:.05em;
}

.primary{
  color:white;
  background:linear-gradient(135deg,#20d9c9,#147e7a);
}

.secondary{
  color:#dce7e8;
  background:#061216;
  border:1px solid var(--line);
}

.manual{
  margin-top:14px;
  padding:15px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(5,15,18,.85);
}

.manual h2{
  margin:0 0 10px;
  font-size:15px;
  font-weight:500;
}

.manualRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:9px;
}

.manual input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#02090b;
  color:white;
  font-size:16px;
  outline:none;
}

.manual button{
  padding:0 17px;
}

.result{
  display:none;
  margin-top:15px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:20px;
  background:linear-gradient(145deg,rgba(9,25,29,.95),rgba(4,13,16,.98));
}

.result.show{
  display:block;
}

.productTop{
  display:grid;
  grid-template-columns:125px 1fr;
  gap:15px;
}

.art{
  min-height:160px;
  border-radius:14px;
  overflow:hidden;
  background:#061115;
  border:1px solid var(--line);
  display:grid;
  place-items:center;
}

.art img{
  width:100%;
  height:100%;
  max-height:200px;
  object-fit:contain;
  background:white;
}

.artEmpty{
  font-size:9px;
  text-align:center;
  color:#637a7d;
}

.result h2{
  margin:0 0 6px;
  font-size:20px;
  font-weight:550;
}

.meta{
  color:#82979a;
  font-size:11px;
  line-height:1.6;
}

.badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px;
}

.badge{
  padding:6px 8px;
  border-radius:999px;
  font-size:9px;
  border:1px solid var(--line);
  background:rgba(34,224,209,.07);
}

.good{
  color:#84efbd;
  border-color:rgba(49,216,135,.28);
  background:rgba(49,216,135,.08);
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:13px;
}

.metric{
  padding:10px;
  background:#051014;
  border-radius:11px;
  border:1px solid rgba(61,238,224,.1);
}

.metric small{
  display:block;
  color:#637a7d;
  font-size:8px;
  text-transform:uppercase;
}

.metric b{
  display:block;
  margin-top:4px;
  font-size:14px;
}

.rescan{
  width:100%;
  margin-top:13px;
}

.footer{
  text-align:center;
  margin-top:20px;
  color:#53696d;
  font-size:9px;
  letter-spacing:.18em;
}

@media(max-width:520px){
  .wrap{padding:8px 8px 80px}
  .cameraWrap{height:62vh}
  .controls{grid-template-columns:1fr}
  .manualRow{grid-template-columns:1fr}
  .manual button{padding:14px}
}
</style>
</head>

<body>

<div class="wrap">

<header class="topbar">

  <a class="back" href="index.html">
    ← HOME
  </a>

  <div class="brand">
    MEDIA DEAL ENGINE
  </div>

  <div class="live">
    <span class="dot"></span>
    LIVE
  </div>

</header>

<section class="hero">
  <h1>SCAN. <span>IDENTIFY.</span> PROFIT.</h1>
  <p>Hold the barcode steady inside the scan frame.</p>
</section>

<section class="scannerCard">

  <div class="cameraWrap">

    <video
      id="video"
      playsinline
      muted>
    </video>

    <div class="overlay">
      <div class="scanBox"></div>
      <div class="laser"></div>
    </div>

  </div>

  <div class="status" id="status">
    Tap Start Camera.
  </div>

  <div class="controls">

    <button
      class="primary"
      id="startBtn">
      START CAMERA
    </button>

    <button
      class="secondary"
      id="stopBtn">
      STOP CAMERA
    </button>

  </div>

</section>

<section class="manual">

  <h2>Manual Barcode</h2>

  <div class="manualRow">

    <input
      id="manualBarcode"
      inputmode="numeric"
      autocomplete="off"
      placeholder="EAN / UPC barcode">

    <button
      class="primary"
      id="identifyBtn">
      IDENTIFY
    </button>

  </div>

</section>

<section
  class="result"
  id="result">

  <div class="productTop">

    <div
      class="art"
      id="art">

      <div class="artEmpty">
        EXACT ARTWORK
      </div>

    </div>

    <div>

      <h2 id="title">
        Product
      </h2>

      <div
        class="meta"
        id="meta">
      </div>

      <div
        class="badges"
        id="badges">
      </div>

    </div>

  </div>

  <div class="metrics">

    <div class="metric">
      <small>Identity</small>
      <b id="confidence">—</b>
    </div>

    <div class="metric">
      <small>Artwork</small>
      <b id="artConfidence">—</b>
    </div>

    <div class="metric">
      <small>Decision</small>
      <b id="decision">—</b>
    </div>

  </div>

  <button
    class="secondary rescan"
    id="rescanBtn">
    SCAN ANOTHER PRODUCT
  </button>

</section>

<div class="footer">
  MEDIA DEAL ENGINE · LIVE RESOLVER
</div>

</div>


<script>

const API =
  'https://deal-engine-api.dennis-deeper.workers.dev';

const video =
  document.getElementById('video');

const statusEl =
  document.getElementById('status');

const resultBox =
  document.getElementById('result');

const startBtn =
  document.getElementById('startBtn');

const stopBtn =
  document.getElementById('stopBtn');

const rescanBtn =
  document.getElementById('rescanBtn');

const manualInput =
  document.getElementById('manualBarcode');

const identifyBtn =
  document.getElementById('identifyBtn');

let reader = null;
let controls = null;
let locked = false;


/* -----------------------------
   BARCODE VALIDATION
----------------------------- */

function cleanBarcode(value){

  return String(value || '')
    .replace(/\D/g,'');

}


function validLength(code){

  return [
    8,
    12,
    13,
    14
  ].includes(code.length);

}


/* -----------------------------
   CAMERA
----------------------------- */

async function startScanner(){

  if(locked){
    locked = false;
  }

  resultBox.classList.remove('show');

  statusEl.textContent =
    'Starting rear camera…';

  try{

    if(
      typeof ZXingBrowser === 'undefined'
    ){

      throw new Error(
        'ZXing scanner library did not load.'
      );

    }

    if(controls){

      try{
        controls.stop();
      }catch(e){}

      controls = null;

    }

    reader =
      new ZXingBrowser.BrowserMultiFormatReader();

    const devices =
      await ZXingBrowser.BrowserCodeReader
      .listVideoInputDevices();

    let deviceId = undefined;

    if(devices && devices.length){

      const rear =
        devices.find(d =>
          /back|rear|environment/i
          .test(d.label)
        );

      deviceId =
        rear
        ? rear.deviceId
        : devices[devices.length - 1].deviceId;

    }

    statusEl.textContent =
      'Scanning… hold the barcode steady.';

    controls =
      await reader.decodeFromVideoDevice(
        deviceId,
        video,
        async (scanResult, error) => {

          if(
            scanResult &&
            !locked
          ){

            const code =
              cleanBarcode(
                scanResult.getText()
              );

            if(
              !validLength(code)
            ){
              return;
            }

            locked = true;

            statusEl.textContent =
              'Barcode detected: ' + code;

            try{

              if(controls){
                controls.stop();
              }

            }catch(e){}

            await resolveBarcode(code);

          }

        }
      );

  }
  catch(err){

    statusEl.textContent =
      'Scanner error: ' +
      (err?.message || 'Unable to start camera.');

  }

}


function stopScanner(){

  try{

    if(controls){
      controls.stop();
    }

  }catch(e){}

  controls = null;

  statusEl.textContent =
    'Camera stopped.';

}


/* -----------------------------
   MEDIA DEAL ENGINE RESOLVER
----------------------------- */

async function resolveBarcode(rawCode){

  const code =
    cleanBarcode(rawCode);

  if(!code){

    statusEl.textContent =
      'Please enter a valid barcode.';

    return;

  }

  stopScanner();

  statusEl.textContent =
    'Barcode found. Identifying exact product…';

  try{

    const response =
      await fetch(
        API +
        '/lookup?barcode=' +
        encodeURIComponent(code),
        {
          cache:'no-store'
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data?.error ||
        ('Resolver ' + response.status)
      );

    }

    displayResult(
      code,
      data
    );

  }
  catch(err){

    statusEl.textContent =
      'Product lookup failed: ' +
      (err?.message || 'Unknown error.');

    locked = false;

  }

}


/* -----------------------------
   PRODUCT RESULT
----------------------------- */

function displayResult(
  code,
  data
){

  const item =
    data.item;

  resultBox.classList.add('show');

  if(!item){

    document.getElementById('title')
      .textContent =
      'Product unresolved';

    document.getElementById('meta')
      .textContent =
      'Barcode: ' + code;

    document.getElementById('badges')
      .innerHTML =
      '<span class="badge">UNRESOLVED</span>';

    document.getElementById('confidence')
      .textContent =
      (data.confidence || 0) + '%';

    document.getElementById('artConfidence')
      .textContent =
      (data.artworkConfidence || 0) + '%';

    document.getElementById('decision')
      .textContent =
      data.decision || 'UNRESOLVED';

    document.getElementById('art')
      .innerHTML =
      '<div class="artEmpty">NO EXACT ARTWORK FOUND</div>';

    statusEl.textContent =
      'Barcode recognised, but no verified product match was found.';

    return;

  }


  document.getElementById('title')
    .textContent =
    item.title ||
    'Identified Product';


  const detailParts = [

    item.platform,
    item.brand,
    item.model,
    item.category

  ].filter(Boolean);


  document.getElementById('meta')
    .textContent =
    'Barcode: ' +
    code +
    (
      detailParts.length
      ? ' · ' +
        detailParts.join(' · ')
      : ''
    );


  let badges = '';

  badges +=
    '<span class="badge good">' +
    (data.decision || 'IDENTIFIED') +
    '</span>';


  if(data.exactMatch){

    badges +=
      '<span class="badge good">EXACT MATCH</span>';

  }


  document.getElementById('badges')
    .innerHTML =
    badges;


  document.getElementById('confidence')
    .textContent =
    (data.confidence ?? 0) + '%';


  document.getElementById('artConfidence')
    .textContent =
    (data.artworkConfidence ?? 0) + '%';


  document.getElementById('decision')
    .textContent =
    data.decision || '—';


  const images =
    (item.images || [])
    .filter(Boolean);


  if(images.length){

    const imageURL =
      API +
      '/image?url=' +
      encodeURIComponent(
        images[0]
      );


    document.getElementById('art')
      .innerHTML =
      '<img src="' +
      imageURL +
      '" alt="Exact product artwork">';

  }
  else{

    document.getElementById('art')
      .innerHTML =
      '<div class="artEmpty">NO EXACT ARTWORK AVAILABLE</div>';

  }


  statusEl.textContent =
    'Product identified successfully.';

}


/* -----------------------------
   BUTTONS
----------------------------- */

startBtn.addEventListener(
  'click',
  startScanner
);


stopBtn.addEventListener(
  'click',
  stopScanner
);


identifyBtn.addEventListener(
  'click',
  () => {

    locked = true;

    resolveBarcode(
      manualInput.value
    );

  }
);


manualInput.addEventListener(
  'keydown',
  e => {

    if(e.key === 'Enter'){

      locked = true;

      resolveBarcode(
        manualInput.value
      );

    }

  }
);


rescanBtn.addEventListener(
  'click',
  () => {

    locked = false;

    resultBox.classList.remove(
      'show'
    );

    startScanner();

  }
);


/* -----------------------------
   CLEANUP
----------------------------- */

window.addEventListener(
  'pagehide',
  () => {

    try{

      if(controls){
        controls.stop();
      }

    }catch(e){}

  }
);

</script>

</body>
</html>
