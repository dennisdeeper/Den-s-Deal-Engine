<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03090b">
<title>Media Deal Engine Scanner</title>

<style>
:root{
  --bg:#03090b;
  --panel:#071317;
  --line:rgba(61,238,224,.16);
  --teal:#22e0d1;
  --text:#f4f7f7;
  --muted:#81969a;
  --green:#31d887;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -15%,rgba(20,181,169,.22),transparent 35%),
    linear-gradient(180deg,#020708 0%,#061014 55%,#020709 100%);
  color:var(--text);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:16px 14px 90px;
}

.topbar{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}

.back{
  color:#d9e3e4;
  text-decoration:none;
  font-size:14px;
}

.brand{
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#dbe5e6;
}

.live{
  display:flex;
  align-items:center;
  gap:7px;
  color:#9db0b3;
  font-size:10px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 5px rgba(49,216,135,.08),0 0 14px rgba(49,216,135,.35);
}

.hero{
  text-align:center;
  padding:34px 0 18px;
}

.logo{
  width:130px;
  height:130px;
  margin:0 auto 18px;
  position:relative;
}

.logoD{
  position:absolute;
  inset:0;
  border:18px solid transparent;
  border-right-color:#20d9c9;
  border-top-color:#d9e4e5;
  border-bottom-color:#6e8387;
  border-radius:0 80px 80px 0;
  filter:drop-shadow(0 0 14px rgba(34,224,209,.25));
}

.logoArrow{
  position:absolute;
  left:28px;
  top:56px;
  width:62px;
  height:18px;
  background:linear-gradient(90deg,#63787c,#20d9c9);
  transform:rotate(-45deg);
  clip-path:polygon(0 22%,68% 22%,68% 0,100% 50%,68% 100%,68% 78%,0 78%);
}

.hero h1{
  margin:0;
  font-weight:300;
  font-size:30px;
  letter-spacing:.06em;
}

.hero h1 span{
  color:var(--teal);
}

.hero p{
  margin:10px auto 0;
  max-width:500px;
  color:#879b9e;
  font-size:13px;
  line-height:1.6;
}

.scannerCard{
  border:1px solid var(--line);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(10,27,31,.94),rgba(4,13,16,.98));
  padding:14px;
  box-shadow:0 28px 70px rgba(0,0,0,.42);
}

.cameraWrap{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  background:#000;
  min-height:360px;
  border:1px solid rgba(70,236,223,.12);
}

video{
  width:100%;
  height:100%;
  min-height:360px;
  object-fit:cover;
  display:block;
  background:#000;
}

.scanOverlay{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.scanBox{
  position:absolute;
  left:10%;
  right:10%;
  top:36%;
  height:120px;
  border:2px solid rgba(34,224,209,.68);
  border-radius:14px;
  box-shadow:
    0 0 0 999px rgba(0,0,0,.30),
    0 0 24px rgba(34,224,209,.16);
}

.laser{
  position:absolute;
  left:12%;
  right:12%;
  top:50%;
  height:2px;
  background:linear-gradient(90deg,transparent,#ff4040,transparent);
  box-shadow:0 0 10px rgba(255,64,64,.9);
}

.status{
  margin:14px 2px 0;
  min-height:20px;
  color:#82979a;
  text-align:center;
  font-size:12px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

button{
  min-height:50px;
  border:0;
  border-radius:14px;
  font:inherit;
  font-weight:700;
  letter-spacing:.04em;
  cursor:pointer;
}

.primary{
  color:#fff;
  background:linear-gradient(135deg,#20d9c9,#147e7a);
}

.secondary{
  color:#dce7e8;
  background:#071317;
  border:1px solid var(--line);
}

.manual{
  margin-top:16px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(5,15,18,.82);
}

.manual h2{
  margin:0 0 10px;
  font-size:16px;
  font-weight:500;
}

.manualRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
}

.manual input{
  width:100%;
  border:1px solid rgba(80,238,224,.16);
  background:#02090b;
  color:white;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

.manual button{
  padding:0 18px;
}

.footer{
  margin-top:24px;
  text-align:center;
  color:#52696c;
  font-size:9px;
  letter-spacing:.14em;
  text-transform:uppercase;
}

@media(max-width:600px){
  .wrap{padding:10px 10px 80px}
  .cameraWrap,video{min-height:420px}
  .controls{grid-template-columns:1fr}
  .manualRow{grid-template-columns:1fr}
  .manual button{padding:14px}
}
</style>
</head>

<body>

<div class="wrap">

  <header class="topbar">
    <a href="index.html" class="back">← Home</a>

    <div class="brand">
      Media Deal Engine
    </div>

    <div class="live">
      <span class="dot"></span>
      LIVE
    </div>
  </header>

  <section class="hero">
    <div class="logo">
      <div class="logoD"></div>
      <div class="logoArrow"></div>
    </div>

    <h1>MEDIA <span>DEAL</span> ENGINE</h1>

    <p>
      Scan the barcode. Identify the exact product. Then send it into the
      live Media Deal Engine resolver.
    </p>
  </section>

  <section class="scannerCard">

    <div class="cameraWrap">
      <video id="video" playsinline muted></video>

      <div class="scanOverlay">
        <div class="scanBox"></div>
        <div class="laser"></div>
      </div>
    </div>

    <div class="status" id="status">
      Camera not started.
    </div>

    <div class="controls">
      <button class="primary" id="startBtn">
        START CAMERA
      </button>

      <button class="secondary" id="stopBtn">
        STOP CAMERA
      </button>
    </div>

  </section>

  <section class="manual">
    <h2>Manual Barcode</h2>

    <div class="manualRow">
      <input
        id="manualBarcode"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Enter EAN / UPC"
      >

      <button class="primary" id="identifyBtn">
        IDENTIFY
      </button>
    </div>
  </section>

  <div class="footer">
    Scan · Identify · Profit
  </div>

</div>

<script>

const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const manualBarcode = document.getElementById('manualBarcode');
const identifyBtn = document.getElementById('identifyBtn');

let stream = null;
let detector = null;
let scanning = false;

function goToLookup(code){
  const clean = String(code || '').replace(/\D/g,'');

  if(!clean){
    statusEl.textContent = 'No valid barcode detected.';
    return;
  }

  window.location.href =
    'index.html?barcode=' + encodeURIComponent(clean) + '#lookup';
}

async function startCamera(){

  statusEl.textContent = 'Starting camera…';

  try{

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1920},
        height:{ideal:1080}
      },
      audio:false
    });

    video.srcObject = stream;
    await video.play();

    statusEl.textContent =
      'Camera ready. Hold barcode inside the frame.';

    if('BarcodeDetector' in window){

      const formats = [
        'ean_13',
        'ean_8',
        'upc_a',
        'upc_e',
        'code_128'
      ];

      detector = new BarcodeDetector({formats});
      scanning = true;
      scanLoop();

    }else{

      statusEl.textContent =
        'Camera is working, but this browser does not support automatic barcode detection. Use Manual Barcode below.';

    }

  }catch(err){

    statusEl.textContent =
      'Unable to start camera: ' +
      (err?.message || 'camera permission error');

  }
}

async function scanLoop(){

  if(!scanning || !detector) return;

  try{

    const codes = await detector.detect(video);

    if(codes && codes.length){

      const raw =
        codes[0].rawValue || '';

      if(raw){

        scanning = false;

        statusEl.textContent =
          'Barcode found: ' + raw;

        stopCamera();

        setTimeout(()=>{
          goToLookup(raw);
        },350);

        return;
      }
    }

  }catch(e){}

  requestAnimationFrame(scanLoop);
}

function stopCamera(){

  scanning = false;

  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    stream = null;
  }

  video.srcObject = null;
}

startBtn.addEventListener('click', startCamera);

stopBtn.addEventListener('click', ()=>{
  stopCamera();
  statusEl.textContent = 'Camera stopped.';
});

identifyBtn.addEventListener('click', ()=>{
  goToLookup(manualBarcode.value);
});

manualBarcode.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){
    goToLookup(manualBarcode.value);
  }
});

</script>

</body>
</html>
