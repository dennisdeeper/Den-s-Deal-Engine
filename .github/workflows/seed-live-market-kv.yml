name: Seed Live Market KV

on:
  push:
    branches:
      - "seed-live-market-*"

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate feed freshness
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("data/live-market.json", "r", encoding="utf-8") as fh:
              data = json.load(fh)

          items = data.get("items", [])
          if not items:
              raise SystemExit("Live Market feed is empty")

          now = datetime.now(timezone.utc)
          for item in items:
              if item.get("status") != "live":
                  continue
              if item.get("sourceVerified") is not True:
                  raise SystemExit(f"Unverified live item: {item.get('id')}")
              stamp = item.get("verifiedAt")
              if not stamp:
                  raise SystemExit(f"Missing verifiedAt: {item.get('id')}")
              dt = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
              age_hours = (now - dt.astimezone(timezone.utc)).total_seconds() / 3600
              max_age = min(max(float(item.get("maxVerificationAgeHours", 12)), 1), 48)
              if age_hours < -0.1 or age_hours > max_age:
                  raise SystemExit(f"Stale live item: {item.get('id')} ({age_hours:.1f}h)")
          print(f"Validated {len(items)} Live Market items.")

      - name: Seed production KV
        shell: bash
        env:
          RAW_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os, re
          raw = os.environ.get("RAW_CF_API_TOKEN", "")
          s = raw.strip().strip('"').strip("'")
          m = re.search(r'Authorization:\s*Bearer\s+([A-Za-z0-9._~-]+)', s, re.I)
          if m:
              s = m.group(1)
          elif s.lower().startswith("bearer "):
              s = s[7:].strip()
          s = re.sub(r'[\r\n\t ]+', '', s)

          aid = re.sub(r'\s+', '', os.environ.get("RAW_CF_ACCOUNT_ID", ""))
          if not s or not aid:
              raise SystemExit("Cloudflare credentials unavailable")

          open("/tmp/cf_api_token", "w").write(s)
          open("/tmp/cf_account_id", "w").write(aid)
          PY
          export CLOUDFLARE_API_TOKEN="$(cat /tmp/cf_api_token)"
          export CLOUDFLARE_ACCOUNT_ID="$(cat /tmp/cf_account_id)"
          npx wrangler@latest kv key put --binding=MDE_MARKET_KV "live-market-feed" --path=data/live-market.json --remote --config backend/cloudflare-worker/wrangler.toml
