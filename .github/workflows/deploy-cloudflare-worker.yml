name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - "deploy-worker-*"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy deal-engine-api
        shell: bash
        env:
          RAW_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os, re
          raw = os.environ.get("RAW_CF_API_TOKEN", "")
          s = raw.strip().strip('"').strip("'")
          m = re.search(r'Authorization:\s*Bearer\s+([A-Za-z0-9._~-]+)', s, re.I)
          if m:
              s = m.group(1)
          elif s.lower().startswith("bearer "):
              s = s[7:].strip()
          s = re.sub(r'[\r\n\t ]+', '', s)

          aid = os.environ.get("RAW_CF_ACCOUNT_ID", "")
          aid = re.sub(r'\s+', '', aid)

          if not s:
              raise SystemExit("CLOUDFLARE_API_TOKEN is empty after normalization")
          if not aid:
              raise SystemExit("CLOUDFLARE_ACCOUNT_ID is empty after normalization")

          open("/tmp/cf_api_token", "w").write(s)
          open("/tmp/cf_account_id", "w").write(aid)
          print("Cloudflare credentials normalized for Wrangler.")
          PY
          export CLOUDFLARE_API_TOKEN="$(cat /tmp/cf_api_token)"
          export CLOUDFLARE_ACCOUNT_ID="$(cat /tmp/cf_account_id)"
          npx wrangler@latest deploy --config backend/cloudflare-worker/wrangler.toml

      - name: Verify production health
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, time

          base = "https://deal-engine-api.dennis-deeper.workers.dev"
          expected_version = "8.2.1-live-market-kv"

          def get_json(path):
              out = subprocess.check_output([
                  "curl", "-fsS",
                  "-A", "Mozilla/5.0 MediaDealEngine-CI",
                  base + path
              ], text=True, timeout=20)
              return json.loads(out)

          last = None
          for _ in range(12):
              try:
                  health = get_json("/health?ci=1")
                  status = get_json("/live-market/status?ci=1")
                  market = get_json("/live-market?ci=1")
                  last = {"health": health, "status": status, "market": {
                      "source": market.get("source"),
                      "count": market.get("count")
                  }}
                  if (
                      health.get("version") == expected_version
                      and health.get("marketStorage") == "kv"
                      and health.get("marketAdminConfigured") is True
                      and status.get("storage") == "kv"
                      and status.get("adminWriteReady") is True
                      and market.get("source") == "kv"
                      and int(market.get("count", 0)) > 0
                  ):
                      print(json.dumps(last, indent=2))
                      raise SystemExit(0)
              except Exception as exc:
                  last = {"error": str(exc)}
              time.sleep(5)

          print(json.dumps(last, indent=2))
          raise SystemExit("Production verification failed")
          PY
