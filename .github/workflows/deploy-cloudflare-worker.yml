name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - "deploy-worker-*"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate Cloudflare safely
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.request

          raw = os.environ.get("RAW_CLOUDFLARE_API_TOKEN", "")
          candidates = []

          def add(v):
              v = (v or "").strip().strip("'\"")
              if v and v not in candidates:
                  candidates.append(v)

          add(raw)
          m = re.search(r"(?i)bearer\s+([A-Za-z0-9._~+/-]{20,})", raw)
          if m:
              add(m.group(1))
          for token in re.findall(r"[A-Za-z0-9._~+/-]{20,}", raw):
              add(token)

          good = None
          for token in candidates:
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4/user/tokens/verify",
                  headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      body = json.load(r)
                  if body.get("success"):
                      good = token
                      break
              except Exception:
                  pass

          if not good:
              raise SystemExit("Could not validate the stored Cloudflare API token.")

          print("Cloudflare API token validated.")
          print("::add-mask::" + good)
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("CLOUDFLARE_API_TOKEN=" + good + "\n")
          PY

      - name: Deploy deal-engine-api
        working-directory: backend/cloudflare-worker
        shell: bash
        run: npx wrangler@latest deploy

      - name: Seed verified Live Market KV
        shell: bash
        run: |
          curl -fsS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/763b501028384e6aa55aa33878ce9450/values/live-market-feed" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @data/live-market.json
          echo

      - name: Verify production health
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, time

          base = "https://deal-engine-api.dennis-deeper.workers.dev"
          expected_version = "8.2.2-product-artwork"

          def get_json(path):
              out = subprocess.check_output([
                  "curl", "-fsS",
                  "-A", "Mozilla/5.0 MediaDealEngine-CI",
                  base + path
              ], text=True, timeout=20)
              return json.loads(out)

          last = None
          for _ in range(12):
              try:
                  health = get_json("/health?ci=1")
                  status = get_json("/live-market/status?ci=1")
                  market = get_json("/live-market?ci=1")
                  last = {"health": health, "status": status, "market": {
                      "source": market.get("source"),
                      "count": market.get("count"),
                      "verifiedAt": market.get("verifiedAt")
                  }}
                  if (
                      health.get("version") == expected_version
                      and health.get("marketStorage") == "kv"
                      and health.get("marketAdminConfigured") is True
                      and status.get("storage") == "kv"
                      and status.get("adminWriteReady") is True
                      and market.get("source") == "kv"
                      and int(market.get("count", 0)) >= 12
                  ):
                      print(json.dumps(last, indent=2))
                      raise SystemExit(0)
              except Exception as exc:
                  last = {"error": str(exc)}
              time.sleep(5)

          print(json.dumps(last, indent=2))
          raise SystemExit("Production verification failed")
          PY
