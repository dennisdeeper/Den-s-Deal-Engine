name: Cloudflare Binding Inspect

on:
  push:
    branches:
      - "inspect-worker-*"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: List KV namespaces
        working-directory: backend/cloudflare-worker
        run: npx wrangler@latest kv namespace list
