name: Cloudflare Binding Inspect

on:
  push:
    branches:
      - "inspect-worker-*"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Authenticate Cloudflare safely
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error

          raw = os.environ.get("RAW_CLOUDFLARE_API_TOKEN", "")
          candidates = []

          def add(v):
              v = (v or "").strip().strip("'\"")
              if v and v not in candidates:
                  candidates.append(v)

          add(raw)
          m = re.search(r"(?i)bearer\s+([A-Za-z0-9._~+/-]{20,})", raw)
          if m:
              add(m.group(1))
          for token in re.findall(r"[A-Za-z0-9._~+/-]{20,}", raw):
              add(token)

          good = None
          for token in candidates:
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4/user/tokens/verify",
                  headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      body = json.load(r)
                  if body.get("success"):
                      good = token
                      break
              except Exception:
                  pass

          if not good:
              raise SystemExit("Could not validate the stored Cloudflare API token.")

          print("Cloudflare API token validated.")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("CLOUDFLARE_API_TOKEN=" + good + "\n")
          print("::add-mask::" + good)
          PY

      - name: Verify account access
        shell: bash
        run: |
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json"
          echo

      - name: List KV namespaces
        shell: bash
        run: |
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json"
          echo
